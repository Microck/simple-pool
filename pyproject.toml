[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-pool"
version = "0.1.0"
description = "Sticky failover router for OpenAI-compatible chat-completions backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Microck", email = "contact@micr.dev" }]
keywords = ["openai", "proxy", "failover", "load-balancer", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
simple-pool = "simple_pool.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
